[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    slow: marks tests as slow (pipeline/smoke renders)
    integration: integration tests spanning multiple modules
    e2e: end-to-end pipeline tests (File 15 layout)
filterwarnings =
    ignore::DeprecationWarning
