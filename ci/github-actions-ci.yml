name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest + coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage
        run: pytest -q --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

      - name: Backend observability tests
        run: pytest -q tests/test_logger.py tests/m5/test_observability_m5.py tests/m7/ -k "docker or observability or health" --collect-only || true
      - name: Docker asset static validation (M7/M8)
        run: pytest -q tests/m7/test_docker_assets_m7.py tests/m8/ -v

  migrations:
    name: Migrations (upgrade + downgrade)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Exercises the real Alembic chain end to end. Before M5 migrations had
      # never run in CI, which is how audit_events shipped without one.
      - name: Migration round-trip (SQLite)
        run: pytest -q tests/m5/test_migrations_m5.py

      - name: Verify a single head
        run: alembic heads
        env:
          DATABASE_URL: sqlite:///./ci-check.db

  # M6: PostgreSQL is the only supported production database, but every
  # migration test until now ran on SQLite. That gap hid M6-F3 — SQLite has no
  # native ENUM type, so it could not reveal that `downgrade` left PostgreSQL
  # enum types behind and wedged the documented rollback procedure.
  #
  # These tests SKIP when TEST_POSTGRES_URL is unset, so without this job they
  # would silently never run and the regression would be unguarded.
  migrations-postgres:
    name: Migrations (PostgreSQL round-trip)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: creator
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: creator_os_ci
        ports:
          - 5432:5432
        # The job must not start querying before the server accepts
        # connections, or the tests skip themselves as "unreachable".
        options: >-
          --health-cmd "pg_isready -U creator -d creator_os_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: PostgreSQL migration and pool regression tests
        run: pytest -q tests/m6/
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://creator:ci-only-not-a-secret@localhost:5432/creator_os_ci

      # Fails the job if the suite skipped instead of running — otherwise an
      # unreachable service container looks like a green build, which is
      # exactly how this regression would go unguarded again.
      #
      # Asserted on the machine-readable JUnit report rather than by grepping
      # console output: `-q` suppresses the summary line, so a naive
      # `grep skipped` passes a fully-skipped run. That false-green was
      # observed while writing this step.
      - name: Assert the PostgreSQL tests actually executed
        run: |
          pytest -q tests/m6/test_postgres_migrations_m6.py \
            --junitxml=/tmp/pg-junit.xml
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          suite = ET.parse("/tmp/pg-junit.xml").getroot().find("testsuite")
          total = int(suite.get("tests", 0))
          skipped = int(suite.get("skipped", 0))
          ran = total - skipped
          print(f"collected={total} skipped={skipped} executed={ran}")
          if ran == 0:
              sys.exit(
                  "::error::PostgreSQL migration tests were all SKIPPED - the "
                  "service container is unreachable, so the M6-F3 enum-cleanup "
                  "regression is NOT guarded."
              )
          PY
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://creator:ci-only-not-a-secret@localhost:5432/creator_os_ci

  frontend:
    name: Frontend (typecheck + build + vitest)
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npx tsc && npx vite build

      # `npm test` is the real script name. The pre-M5 workflow called
      # `npm run test:run --if-present`, which does not exist, so the frontend
      # test step silently passed without executing anything.
      - name: Unit tests
        run: npm test

      - name: Frontend production artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: ignore

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        run: docker build -t creator-os-backend:ci ./backend

      - name: Validate backend image metadata
        run: |
          docker image inspect creator-os-backend:ci --format '{{json .Config}}' | python3 -m json.tool
          echo "Checking backend image layers..."
          docker history creator-os-backend:ci --no-trunc | head -30
          echo "Checking healthcheck..."
          docker inspect --format='{{json .Config.Healthcheck}}' creator-os-backend:ci
          echo "Checking non-root user..."
          docker inspect --format='User={{.Config.User}}' creator-os-backend:ci

      - name: Build frontend image
        run: docker build -t creator-os-frontend:ci ./frontend

      - name: Validate frontend image metadata
        run: |
          docker image inspect creator-os-frontend:ci --format '{{json .Config}}' | python3 -m json.tool
          docker inspect --format='{{json .Config.Healthcheck}}' creator-os-frontend:ci
          echo "Frontend image built successfully"

      - name: Validate compose file
        run: |
          docker compose version
          docker compose config
          echo "Compose file validation passed"

      - name: Test compose startup (smoke)
        run: |
          cp .env.production.example .env
          # Generate random secrets for CI
          SECRET=$(python3 -c "import secrets; print(secrets.token_urlsafe(32))")
          PGPASS=$(python3 -c "import secrets; print(secrets.token_urlsafe(16))")
          sed -i "s/^AUTH_SECRET_KEY=.*/AUTH_SECRET_KEY=$SECRET/" .env
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$PGPASS/" .env
          echo "Starting stack..."
          docker compose --profile tools run --rm migrate
          docker compose up -d --wait --wait-timeout 120
          echo "Checking health endpoints..."
          curl -fsS http://localhost:8080/health/live
          curl -fsS http://localhost:8080/health/ready || (docker compose logs && exit 1)
          echo "Health checks passed"
          docker compose down -v
          echo "Smoke test completed"

  examples:
    name: Example workflows verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start backend and verify examples
        run: |
          alembic upgrade head
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/backend.log 2>&1 &
          BACKEND_PID=$!
          echo "Backend PID: $BACKEND_PID"
          # Wait for health
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/health > /dev/null 2>&1; then
              echo "Backend ready after $i attempts"
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/health
          cd ..
          python scripts/verify_examples.py
          kill $BACKEND_PID || true
          wait $BACKEND_PID || true
          cat /tmp/backend.log

  production-build:
    name: Production build verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Backend import validation (production settings)
        run: |
          cd backend
          pip install -r requirements.txt
          ENVIRONMENT=production AUTH_ENABLED=true AUTH_SECRET_KEY=test-key-for-ci-validation-only-32chars AUTH_BOOTSTRAP_USERNAME=admin AUTH_BOOTSTRAP_PASSWORD=temp123 POSTGRES_PASSWORD=test DATABASE_URL=sqlite:///./prod-check.db CORS_ORIGINS=https://example.com ALLOWED_HOSTS=example.com python -c "from app.infrastructure.config.settings import settings; print('Production settings import OK'); from app.main import app; print('App factory OK')"

      - name: Frontend production build
        run: |
          cd frontend
          npm ci --no-audit --no-fund
          npx tsc && npx vite build
          ls -lh dist/
          test -f dist/index.html
