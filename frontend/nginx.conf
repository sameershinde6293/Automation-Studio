# nginx configuration for the Creator OS frontend image (M5).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads pass through this proxy, so the limit must not be smaller than
    # the backend's own MAX_REQUEST_BYTES or nginx will reject them first.
    client_max_body_size 64m;

    # Do not advertise the exact nginx version.
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Defence-in-depth headers. The backend sets its own on API responses;
    # these cover the static assets nginx serves directly.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Hashed asset filenames are immutable, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or clients pin an old bundle that
    # references asset hashes which no longer exist.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        expires off;
    }

    # API and probes are proxied to the backend service.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Server-Sent Events: execution streaming breaks if the response is
        # buffered or cut short by the default read timeout.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location /health {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        access_log off;
    }

    # Single-page app: unknown paths fall back to the shell, which routes
    # client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
