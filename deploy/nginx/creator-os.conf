# Creator OS - Host-level reverse proxy with TLS termination
# Place in /etc/nginx/sites-available/creator-os and symlink to sites-enabled
#
# This is the recommended production front-end for the docker-compose stack,
# which itself serves plain HTTP on ${HTTP_PORT:-8080}. TLS is terminated here.
#
# Prerequisites:
# - Certbot or other ACME client for Let's Encrypt
# - Backend stack running on localhost:${HTTP_PORT:-8080}
#
# Usage:
#   sudo cp deploy/nginx/creator-os.conf /etc/nginx/sites-available/creator-os
#   sudo ln -s /etc/nginx/sites-available/creator-os /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

upstream creator_os_backend {
    server 127.0.0.1:8080;
    # For multi-host: add more backends, but note M6 limitation:
    # Creator OS is single-process only (in-memory queue, per-process rate limit)
    # Do NOT add more replicas until durable queue exists (M8+)
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name studio.example.com;

    # For ACME HTTP-01 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name studio.example.com;

    # TLS - Replace with your real paths
    ssl_certificate /etc/letsencrypt/live/studio.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/studio.example.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/studio.example.com/chain.pem;

    # Security headers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "no-referrer" always;

    # Limits - must be >= backend MAX_REQUEST_BYTES (25 MiB)
    client_max_body_size 64m;
    client_body_timeout 60s;

    # Logging with JSON for aggregation
    access_log /var/log/nginx/creator-os-access.log;
    error_log /var/log/nginx/creator-os-error.log warn;

    # Gzip for API responses (backend also gzips, but proxy level helps for static)
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        proxy_pass http://creator_os_backend;
        proxy_http_version 1.1;

        # Critical: overwrite X-Forwarded-For, do not trust client-supplied values
        # Otherwise clients can spoof IP and evade rate limits
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required for Server-Sent Events (execution streaming)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # WebSocket upgrade (future use)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Health checks should not flood access logs
    location /health {
        proxy_pass http://creator_os_backend;
        proxy_set_header Host $host;
        access_log off;
    }

    # Metrics - restrict to internal network if METRICS_REQUIRE_AUTH=false
    location /metrics {
        # Allow only internal monitoring
        # allow 10.0.0.0/8;
        # allow 172.16.0.0/12;
        # deny all;
        proxy_pass http://creator_os_backend;
        proxy_set_header Host $host;
    }
}
