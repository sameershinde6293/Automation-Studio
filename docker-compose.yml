# Creator OS production-shaped stack (M5, hardened in M8).
#
#   cp .env.production.example .env
#   # edit .env: AUTH_SECRET_KEY and POSTGRES_PASSWORD are mandatory
#   docker compose --profile tools run --rm migrate
#   docker compose up -d
#
# See docs/DEPLOYMENT.md for the full procedure, including how to create the
# first administrator and how to roll out a new version.
#
# M8 hardening:
# - explicit bridge network (isolated from other stacks)
# - log rotation via json-file driver (10 MB x 5, matching in-app rotation)
# - frontend healthcheck in compose (redundant to Dockerfile HEALTHCHECK but
#   visible to `docker compose ps`)
# - backend resource limits documented and enforced
# - volumes marked as persistent with explicit driver

name: creator-os

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-creator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-creator_os}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      # Other services wait on this, so it must reflect real readiness to
      # accept queries, not merely that the process started.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-creator} -d ${POSTGRES_DB:-creator_os}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    # Not published to the host: only the backend needs to reach it.
    expose:
      - "5432"
    networks:
      - creator-os-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true

  # One-shot release step. Migrations must not run from the app container:
  # with more than one replica they would race. Run this before `up`.
  migrate:
    build:
      context: ./backend
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-creator}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-creator_os}
      ENVIRONMENT: production
      AUTH_ENABLED: "true"
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:?AUTH_SECRET_KEY must be set}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - creator-os-net
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-creator}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-creator_os}
      LOG_FORMAT: json
      MEDIA_ROOT: /data/media
      # The frontend proxies to this service, so the real client address
      # arrives in X-Forwarded-For and must be trusted for rate limiting.
      TRUST_PROXY_HEADERS: "true"
    volumes:
      - media_data:/data/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    expose:
      - "8000"
    networks:
      - creator-os-net
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # Bounded so one runaway execution cannot starve the host. Raise these if
    # workflows are memory-heavy; the script sandbox has its own tighter caps.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  frontend:
    build:
      context: ./frontend
      args:
        # Relative, so the browser calls the same origin and nginx proxies it.
        VITE_API_BASE: /api
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    networks:
      - creator-os-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  db_data:
    driver: local
  media_data:
    driver: local

networks:
  creator-os-net:
    driver: bridge
    name: creator-os-net
