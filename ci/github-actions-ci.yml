name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest + coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage
        run: pytest -q --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  migrations:
    name: Migrations (upgrade + downgrade)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Exercises the real Alembic chain end to end. Before M5 migrations had
      # never run in CI, which is how audit_events shipped without one.
      - name: Migration round-trip (SQLite)
        run: pytest -q tests/m5/test_migrations_m5.py

      - name: Verify a single head
        run: alembic heads
        env:
          DATABASE_URL: sqlite:///./ci-check.db

  # M6: PostgreSQL is the only supported production database, but every
  # migration test until now ran on SQLite. That gap hid M6-F3 — SQLite has no
  # native ENUM type, so it could not reveal that `downgrade` left PostgreSQL
  # enum types behind and wedged the documented rollback procedure.
  #
  # These tests SKIP when TEST_POSTGRES_URL is unset, so without this job they
  # would silently never run and the regression would be unguarded.
  migrations-postgres:
    name: Migrations (PostgreSQL round-trip)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: creator
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: creator_os_ci
        ports:
          - 5432:5432
        # The job must not start querying before the server accepts
        # connections, or the tests skip themselves as "unreachable".
        options: >-
          --health-cmd "pg_isready -U creator -d creator_os_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: PostgreSQL migration and pool regression tests
        run: pytest -q tests/m6/
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://creator:ci-only-not-a-secret@localhost:5432/creator_os_ci

      # Fails the job if the suite skipped instead of running — otherwise an
      # unreachable service container looks like a green build, which is
      # exactly how this regression would go unguarded again.
      #
      # Asserted on the machine-readable JUnit report rather than by grepping
      # console output: `-q` suppresses the summary line, so a naive
      # `grep skipped` passes a fully-skipped run. That false-green was
      # observed while writing this step.
      - name: Assert the PostgreSQL tests actually executed
        run: |
          pytest -q tests/m6/test_postgres_migrations_m6.py \
            --junitxml=/tmp/pg-junit.xml
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          suite = ET.parse("/tmp/pg-junit.xml").getroot().find("testsuite")
          total = int(suite.get("tests", 0))
          skipped = int(suite.get("skipped", 0))
          ran = total - skipped
          print(f"collected={total} skipped={skipped} executed={ran}")
          if ran == 0:
              sys.exit(
                  "::error::PostgreSQL migration tests were all SKIPPED - the "
                  "service container is unreachable, so the M6-F3 enum-cleanup "
                  "regression is NOT guarded."
              )
          PY
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://creator:ci-only-not-a-secret@localhost:5432/creator_os_ci

  frontend:
    name: Frontend (typecheck + build + vitest)
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npx tsc && npx vite build

      # `npm test` is the real script name. The pre-M5 workflow called
      # `npm run test:run --if-present`, which does not exist, so the frontend
      # test step silently passed without executing anything.
      - name: Unit tests
        run: npm test

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t creator-os-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t creator-os-frontend:ci ./frontend
